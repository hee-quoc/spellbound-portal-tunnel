<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spellbound Portal Tunnel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- left: what the look is made of -->
  <aside class="side" id="side" aria-label="Styles and colours">
    <div class="logo"><span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20 12 4l8 16h-4l-4-8-4 8z" fill="currentColor"/></svg></span>
      <span class="name">Spellbound<small>Portal tunnel</small></span></div>
    <section class="sec">
      <div class="sec-h">Style</div>
      <div class="styles" id="presets" role="radiogroup" aria-label="Style"></div>
    </section>
    <section class="sec">
      <div class="sec-h">Colour</div>
      <div class="tiles" id="palettesHost" role="radiogroup" aria-label="Palette"></div>
    </section>
    <section class="sec">
      <button class="sec-row" type="button" id="savedToggle" aria-expanded="false"><span>Saved looks</span><span class="count" id="savedCount">0</span><svg class="chev" viewBox="0 0 16 16" width="14" height="14"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="saved" id="savedList" hidden></div>
    </section>
    <div class="locks">
      <label class="tog"><input type="checkbox" id="lockShape"> Lock skeleton + brush</label>
      <label class="tog"><input type="checkbox" id="showAll"> Show all controls</label>
    </div>
  </aside>

  <header class="top">
    <h1 class="title">Portal Tunnel</h1>
    <div class="toolbar" role="toolbar" aria-label="Edit">
      <button class="ibtn" id="bUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M8 5 4 9l4 4M4 9h8a4 4 0 0 1 0 8h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ibtn" id="bRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 20 20" width="18" height="18"><path d="m12 5 4 4-4 4m4-4H8a4 4 0 0 0 0 8h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ibtn" id="bReset" type="button" title="Reset to the style" aria-label="Reset to the style"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M4 10a6 6 0 1 0 2-4.5M4 4v3h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="sep"></span>
      <input id="lookName" type="text" placeholder="Name this look" aria-label="Name this look" maxlength="40">
      <button class="btn soft" id="bSave" type="button">Save</button>
    </div>
    <div class="acts">
      <button class="btn" id="bPlay" type="button">Pause</button>
      <div class="menu">
        <button class="btn dark" id="bExport" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M10 3v9m-4-4 4 4 4-4M4 15h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Export</button>
        <div class="menu-pop" id="exportMenu" hidden>
          <button type="button" id="bPng">PNG image</button>
          <button type="button" id="bMp4">MP4 video</button>
          <button type="button" id="bJson">Copy rules (JSON)</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="stagewrap">
      <span class="tag" id="styleTag">Chained vortex</span>
      <div id="stage"></div>
    </div>
    <div class="dock" role="toolbar" aria-label="Frame">
      <label class="dl">Frame <select id="fmt">
        <option value="4:5">4:5 · brand asset</option>
        <option value="card">63:88 · trading card</option>
        <option value="1:1">1:1 · post</option>
        <option value="9:16">9:16 · story</option>
        <option value="banner">1:4 · motion banner</option>
        <option value="16:9">16:9 · screen</option>
      </select></label>
      <button class="btn" id="bOpen2" type="button">Replay opening</button>
      <span class="dl">seed <b id="seedOut">7</b></span>
      <label class="dl sw-toggle">UI <input type="checkbox" id="uiToggle" checked role="switch" aria-label="Show panels"><i></i></label>
    </div>
  </main>

  <aside id="panel" class="inspector" aria-label="Controls">
    <div class="insp-h"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 6h9M15 6h2M3 14h3M9 14h8M12 4v4M6 12v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><b id="inspTitle">Chained vortex</b><small>Effect</small></div>
  </aside>
</div>
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <h2 id="mTitle">Export</h2>
    <div id="mBody"></div>
    <div class="row"><button class="btn primary" id="mSave" type="button" hidden>Download</button><button class="btn" id="mClose" type="button">Close</button></div>
    <p class="hint" id="mHint"></p>
  </div>
</div>
<div id="svgProbe" style="position:absolute;left:-9999px;top:0;width:400px;height:400px;overflow:hidden;visibility:hidden" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.9/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
<script src="shapes.js"></script>
<script src="brush.js"></script>
<script src="color.js"></script>
<script src="util.js"></script>
<script src="lightShader.js"></script>
<script src="pattern.js"></script>
<script src="banner.js"></script>
<script src="recorder.js"></script>
<script src="gui.js"></script>
<script src="sketch.js"></script>
</body>
</html>
